name: reallife

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-nest_vue}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nest_vue}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [nest-vue]

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runner
    image: ghcr.io/team-croffle/reallife:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ:-Asia/Seoul}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-nest_vue}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
      SMTP_PASS: ${SMTP_PASS:?SMTP_PASS is required}
      MAIL_FROM: ${MAIL_FROM:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      AI_TASKS_PER_MINUTE: ${AI_TASKS_PER_MINUTE:-12}
      AI_DIRECT_CALLS_PER_MINUTE: ${AI_DIRECT_CALLS_PER_MINUTE:-3}
      AI_CALL_TIMEOUT_MS: ${AI_CALL_TIMEOUT_MS:-30000}
      AI_STALE_RUNNING_MS: ${AI_STALE_RUNNING_MS:-60000}
    ports:
      - '${SERVER_PORT:-3000}:3000'
    networks: [nest-vue]

volumes:
  postgres-data:

networks:
  nest-vue:
    driver: bridge
