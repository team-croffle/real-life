name: nest-vue-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nest_vue}
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nest_vue}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [nest-vue-dev]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-dev-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [nest-vue-dev]

  # 버킷 최초 생성용 1회성 컨테이너 (완료 후 종료되는 것이 정상)
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-nest-vue}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        echo "bucket ready: $$S3_BUCKET"
    restart: 'no'
    networks: [nest-vue-dev]

  adminer:
    image: adminer:5
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    networks: [nest-vue-dev]

  # NestJS 를 컨테이너 안에서 watch 모드로 돌리고 싶을 때만 사용한다.
  #   docker compose -f docker/docker-compose.dev.yaml --profile server up
  # 호스트에서 `pnpm dev:server` 로 돌린다면 이 서비스는 띄우지 않아도 된다.
  server:
    profiles: [server]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      TZ: ${TZ:-Asia/Seoul}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nest_vue}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-nest-vue}
      S3_FORCE_PATH_STYLE: 'true'
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
    ports:
      - '${SERVER_PORT:-3000}:3000'
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/server/node_modules
      - /app/web/node_modules
      - /app/shared/node_modules
      - /app/server/dist
    command: pnpm --filter @nest-vue/server dev
    networks: [nest-vue-dev]

volumes:
  postgres-dev-data:
  minio-dev-data:

networks:
  nest-vue-dev:
    driver: bridge
