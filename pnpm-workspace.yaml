packages:
  - shared
  - server
  - web

allowBuilds:
  '@google/genai': true
  '@parcel/watcher': true
  esbuild: true
  protobufjs: true
  unrs-resolver: true

audit:
  ignore:
    - GHSA-67mh-4wv8-2f99

# 워크스페이스 전역에서 동일 버전을 강제할 패키지
catalog:
  typescript: 7.0.2

