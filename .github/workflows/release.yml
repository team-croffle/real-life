# API image release (GHCR) + draft GitHub Release
#
# Run this workflow from Actions and enter a version. Pushing to master alone does not change the image.
# Order: commit package.json at that version and tag it → push to GHCR → draft release.

name: API release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without a leading v. Example: 0.1.0'
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: api-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/team-croffle/reallife

jobs:
  version:
    name: Commit version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      ref: ${{ steps.commit.outputs.ref }}
      is_prerelease: ${{ steps.calc.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Only on master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::API release runs only on master."
          exit 1

      - id: calc
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          NEXT="${INPUT_VERSION#v}"
          if [[ ! "$NEXT" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Not a valid version: ${INPUT_VERSION}"
            exit 1
          fi
          IS_PRE=false
          if [[ "$NEXT" == *-* ]]; then
            IS_PRE=true
          fi
          TAG="v${NEXT}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "::error::Tag ${TAG} already exists."
            exit 1
          fi
          {
            echo "version=${NEXT}"
            echo "tag=${TAG}"
            echo "is_prerelease=${IS_PRE}"
          } >> "$GITHUB_OUTPUT"

      - name: Set package.json version
        shell: bash
        env:
          NEW_VERSION: ${{ steps.calc.outputs.version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.NEW_VERSION;
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = version;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - id: commit
        shell: bash
        env:
          NEW_VERSION: ${{ steps.calc.outputs.version }}
          TAG: ${{ steps.calc.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if ! git diff --cached --quiet; then
            git commit -m "release: v${NEW_VERSION}"
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                break
              fi
              if [[ $attempt -eq 3 ]]; then
                echo "branch push failed after 3 attempts" >&2
                exit 1
              fi
              git pull --rebase origin "${GITHUB_REF_NAME}"
            done
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    name: Push GHCR and draft release
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=${{ needs.version.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.version.outputs.is_prerelease == 'false' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          IS_PRE: ${{ needs.version.outputs.is_prerelease }}
          IMAGE: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          NOTES="$(cat <<EOF
          Image: \`${IMAGE}:${VERSION}\`

          \`\`\`sh
          docker pull ${IMAGE}:${VERSION}
          \`\`\`
          EOF
          )"
          ARGS=(--draft --title "$TAG" --notes "$NOTES")
          if [[ "$IS_PRE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$TAG" "${ARGS[@]}" --repo "$GITHUB_REPOSITORY"
