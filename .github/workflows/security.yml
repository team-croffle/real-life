name: Security

on:
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Audit production dependencies
        run: pnpm audit --prod --ignore-registry-errors

      - name: Audit dev dependencies (warning only)
        run: pnpm audit --dev --ignore-registry-errors
        continue-on-error: true
